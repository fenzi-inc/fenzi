# Rebuilds every agent image for linux/amd64 and linux/arm64 and checks that
# each binary agent.yaml names for that processor is in the image, is its own
# real path, is executable by the sandbox user, and is an ELF program for that
# processor. Runs weekly because the base image tag moves and a package can
# change what it installs, by hand, and when the catalog changes.
name: Agent images

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
  push:
    paths:
      - "agents/**"
      - ".github/workflows/agent-images.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/agent-images.yml"

permissions:
  contents: read

concurrency:
  group: agent-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    name: Catalog tests
    runs-on: ubuntu-24.04
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./agents/...
      - name: List agent folders
        id: list
        run: |
          agents=$(for f in agents/*/agent.yaml; do
            d=$(dirname "$f")
            if [ -f "$d/Dockerfile" ]; then basename "$d"; fi
          done | jq -R . | jq -cs .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "Agents: $agents"

  image:
    name: ${{ matrix.agent }} ${{ matrix.platform }}
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.catalog.outputs.agents) }}
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The runner is amd64. QEMU runs the arm64 build and the check.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check
        run: agents/check-images.sh --platform "$PLATFORM" "$AGENT"
        env:
          PLATFORM: ${{ matrix.platform }}
          AGENT: ${{ matrix.agent }}
