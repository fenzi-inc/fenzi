# Reviewed copy of providers/openai.yaml from OpenShell v0.1.2 (Apache-2.0).
# Upstream's providers/codex.yaml injects ChatGPT login tokens and opens
# auth.openai.com, chatgpt.com and ab.chatgpt.com. Fenzi runs Codex with an
# API key only, which is the openai profile's shape.
# Changes from upstream, reviewed 6 October 2026:
#   - binaries name the native codex program in the fenzi/codex image, one
#     path per architecture. The npm codex command is a Node launcher that
#     starts it; OpenShell matches the kernel-resolved path of the program that
#     connects.
#   - id changed so it cannot collide with an organization's own openai.
id: fenzi-codex
display_name: Codex (Fenzi)
description: Codex CLI in the fenzi/codex image, with an OpenAI API key
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key used by Codex
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/aarch64-unknown-linux-musl/bin/codex
  - /usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
