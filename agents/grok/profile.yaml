# OpenShell 0.1.2 has no Grok profile. This uses the credential shape of
# providers/openai.yaml (Apache-2.0): a bearer token in the authorization
# header. docs.x.ai, checked 6 October 2026, says API-key auth sends
# Authorization: Bearer to https://api.x.ai/v1 (GROK_XAI_API_BASE_URL).
# The binary path is the program the npm grok command resolves to in the
# fenzi/grok image.
id: fenzi-grok
display_name: Grok (Fenzi)
description: Grok CLI in the fenzi/grok image, with an xAI API key
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: xAI API key used by Grok
    env_vars: [XAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.x.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/lib/node_modules/@xai-official/grok/bin/grok-native
