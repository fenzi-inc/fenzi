name: claude
display: Claude Code
command: claude
image: fenzi/claude
# Bump together with CLAUDE_CODE_VERSION in the Dockerfile.
version: "2.1.288"
# The npm package's claude command is a native binary. OpenShell matches the
# kernel-resolved path, so this is the target of /usr/local/bin/claude
# (readlink -f in the image). Tools the agent starts inherit its rules.
binaries:
  - /usr/local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
# The endpoints of profile.yaml. The provider adds them to the effective
# policy; the boundary must contain them in the same form.
model:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
# First-run setup checks api.anthropic.com and platform.claude.com and exits
# if either fails (code.claude.com/docs/en/errors, "Unable to connect to
# Anthropic services"). Seen in the first real run: ECONNREFUSED on
# platform.claude.com. Signing in with a Claude subscription then trades the
# pasted code for a token: denied on 17 October 2026 as
# POST platform.claude.com/v1/oauth/token under the read-only rule. Reads
# stay open; that one path is the only write. The key is never sent there.
hosts:
  - host: platform.claude.com
    port: 443
    allow:
      - GET /**
      - HEAD /**
      - OPTIONS /**
      - POST /v1/oauth/token
# Documented in code.claude.com/docs/en/env-vars: turns off auto-updates,
# telemetry, error reporting, and the release notes fetch from
# raw.githubusercontent.com, which would otherwise file a request every run.
env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
# code.claude.com/docs/en/cli-reference: "Append custom text to the end of the
# default system prompt".
guide_flag: --append-system-prompt
# `claude --help` in 2.1.288: "-c, --continue  Continue the most recent
# conversation in the current directory".
resume: [--continue]
# claude --help in 2.1.288 lists "auto" and "manual" among the modes. In auto,
# Claude's own check can refuse a command before it reaches the sandbox; in
# manual a person approves each action and the policy decides the rest.
# `fenzi run claude --permission-mode auto` still picks auto.
default_flags:
  --permission-mode: manual
# Claude asks whether to use the API key it finds in the environment, with No
# marked as recommended. The value is the sandbox placeholder; No leaves Claude
# without a key, which is what a subscription user wants before /login.
start_note: "Claude may ask whether to use the API key it found. Choose Yes for the key you stored: Claude sees a placeholder, not your key. To use your Claude subscription instead, choose No, then type /login, or start with fenzi run --sign-in claude."
# With no key stored, run starts Claude Code without a provider and the model
# API rule is compiled into the sandbox's policy, in the same form. Claude
# then asks how to sign in; a subscription sign-in posts its code to
# platform.claude.com (hosts above). The token is kept in ~/.claude inside the
# sandbox, outside the project copy, and goes when the sandbox is deleted.
sign_in_note: "Claude asks you to sign in. Choose your Claude subscription and paste back the code your browser shows. To use a key instead, run fenzi key set claude, then fenzi run without --sign-in."
# fenzi run --headless. `claude --help` in 2.1.288: "-p, --print  Print
# response and exit"; the prompt is the last argument. In -p mode nobody
# answers Claude's own prompts, so manual would refuse every tool; with
# bypassPermissions Claude asks nothing and the sandbox's policy decides,
# as it does in every mode. `-- --permission-mode auto` keeps Claude's own
# check as well.
headless:
  args: [-p]
  flags:
    --permission-mode: bypassPermissions
# How the agent reads the MCP servers in the policy's mcp section (agents/mcp.go).
mcp_format: claude-json
key:
  env: ANTHROPIC_API_KEY
  profile_type: fenzi-claude-code
  profile_file: profile.yaml
# testing until a full run with a real key passes on macOS and Linux.
status: testing
verified: false
